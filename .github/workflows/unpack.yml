# 一次性：把上傳的 datong-platform-github.zip 解開成原始資料夾結構（完成後可刪除本檔）
name: 解開程式包
on:
  push:
    paths: ['datong-platform-github.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f datong-platform-github.zip || { echo "找不到程式包"; exit 0; }
          unzip -q datong-platform-github.zip -d "$RUNNER_TEMP/pkg"
          rm -rf "$RUNNER_TEMP/pkg/datong-platform/.github"
          cp -a "$RUNNER_TEMP/pkg/datong-platform/." .
          git rm -q datong-platform-github.zip
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "解開程式包"
          git push
